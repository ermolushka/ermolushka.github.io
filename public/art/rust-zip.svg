<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="z-bg" x1="0" y1="0" x2="1200" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0c0800"/>
      <stop offset="100%" stop-color="#130f02"/>
    </linearGradient>
    <filter id="z-gf">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .z-hl  { animation: z-hl 4s ease-in-out infinite; }
    .z-hl2 { animation: z-hl 4s ease-in-out infinite; animation-delay: 1s; }
    .z-hl3 { animation: z-hl 4s ease-in-out infinite; animation-delay: 2s; }
    .z-hl4 { animation: z-hl 4s ease-in-out infinite; animation-delay: 3s; }
    .z-blink { animation: z-blink 1.1s step-end infinite; }
    .z-lbl  { animation: z-breathe 3s ease-in-out infinite; }
    .z-lbl2 { animation: z-breathe 3s ease-in-out infinite; animation-delay: .8s; }
    .z-lbl3 { animation: z-breathe 3s ease-in-out infinite; animation-delay: 1.6s; }
    .z-lbl4 { animation: z-breathe 3s ease-in-out infinite; animation-delay: 2.4s; }
    @keyframes z-hl      { 0%,100%{opacity:.15} 50%{opacity:.35} }
    @keyframes z-blink   { 0%,100%{opacity:1} 50%{opacity:0} }
    @keyframes z-breathe { 0%,100%{opacity:.4} 50%{opacity:.85} }
  </style>

  <rect width="1200" height="380" fill="url(#z-bg)"/>

  <!-- subtle grid -->
  <g stroke="#f59e0b" stroke-width=".4" opacity=".025">
    <line x1="0"    y1="95"  x2="1200" y2="95"/>
    <line x1="0"    y1="190" x2="1200" y2="190"/>
    <line x1="0"    y1="285" x2="1200" y2="285"/>
    <line x1="420"  y1="0"   x2="420"  y2="380"/>
    <line x1="760"  y1="0"   x2="760"  y2="380"/>
    <line x1="1000" y1="0"   x2="1000" y2="380"/>
  </g>

  <!-- ─── LEFT: hex dump view ─── -->
  <text x="55" y="48" fill="#f59e0b" font-family="IBM Plex Mono,monospace" font-size="10" opacity=".4">offset    00 01 02 03  04 05 06 07  08 09 0a 0b  │ ascii</text>
  <line x1="55" y1="52" x2="420" y2="52" stroke="#f59e0b" stroke-width=".4" stroke-opacity=".2"/>

  <!-- hex rows — highlight one region at a time -->
  <!-- Local File Header signature PK\x03\x04 -->
  <rect x="50" y="56" width="373" height="16" rx="1" fill="#f59e0b" class="z-hl"/>
  <text x="55" y="69" fill="#f59e0b" font-family="IBM Plex Mono,monospace" font-size="10" font-weight="700">00000000  50 4b 03 04  14 00 00 00  08 00 a8 5c  │ PK··············</text>

  <text x="55" y="87" fill="#d97706" font-family="IBM Plex Mono,monospace" font-size="10" opacity=".7">00000010  4b 59 00 00  00 00 00 00  00 00 08 00  │ KY··············</text>
  <text x="55" y="105" fill="#d97706" font-family="IBM Plex Mono,monospace" font-size="10" opacity=".55">00000020  00 00 74 65  73 74 2e 74  78 74 48 65  │ ··test.txtHe····</text>
  <text x="55" y="123" fill="#d97706" font-family="IBM Plex Mono,monospace" font-size="10" opacity=".4">00000030  6c 6c 6f 20  57 6f 72 6c  64 0a 50 4b  │ llo World·PK····</text>

  <!-- Central directory signature PK\x01\x02 -->
  <rect x="50" y="128" width="373" height="16" rx="1" fill="#22c55e" class="z-hl2"/>
  <text x="55" y="141" fill="#22c55e" font-family="IBM Plex Mono,monospace" font-size="10" font-weight="700">00000040  50 4b 01 02  14 03 14 00  00 00 08 00  │ PK··············</text>

  <text x="55" y="159" fill="#16a34a" font-family="IBM Plex Mono,monospace" font-size="10" opacity=".6">00000050  a8 5c 4b 59  0b 00 00 00  09 00 00 00  │ ·\KY············</text>
  <text x="55" y="177" fill="#16a34a" font-family="IBM Plex Mono,monospace" font-size="10" opacity=".45">00000060  08 00 00 00  00 00 00 00  00 00 80 81  │ ················</text>
  <text x="55" y="195" fill="#16a34a" font-family="IBM Plex Mono,monospace" font-size="10" opacity=".3">00000070  00 00 00 00  74 65 73 74  2e 74 78 74  │ ····test.txt····</text>

  <!-- EOCD signature PK\x05\x06 -->
  <rect x="50" y="200" width="373" height="16" rx="1" fill="#38bdf8" class="z-hl3"/>
  <text x="55" y="213" fill="#38bdf8" font-family="IBM Plex Mono,monospace" font-size="10" font-weight="700">00000080  50 4b 05 06  00 00 00 00  01 00 01 00  │ PK··············</text>

  <text x="55" y="231" fill="#0891b2" font-family="IBM Plex Mono,monospace" font-size="10" opacity=".55">00000090  3c 00 00 00  3c 00 00 00  00 00        │ &lt;···&lt;·········</text>

  <!-- cursor -->
  <text x="55" y="263" fill="#f59e0b" font-family="IBM Plex Mono,monospace" font-size="10" opacity=".3">000000a0  <tspan class="z-blink">▌</tspan></text>

  <!-- file label -->
  <text x="55" y="340" fill="#f59e0b" font-family="IBM Plex Mono,monospace" font-size="9" opacity=".3">archive.zip · 0xa4 bytes</text>
  <text x="55" y="356" fill="#f59e0b" font-family="IBM Plex Mono,monospace" font-size="9" opacity=".2">parsed with Rust · no_std</text>

  <!-- ─── CENTER divider ─── -->
  <line x1="440" y1="30" x2="440" y2="350" stroke="#f59e0b" stroke-width=".5" stroke-opacity=".15"/>

  <!-- ─── RIGHT: ZIP structure diagram ─── -->
  <text x="760" y="38" text-anchor="middle" fill="#f59e0b" font-family="IBM Plex Mono,monospace" font-size="11" opacity=".5">ZIP file structure</text>

  <!-- Structure blocks (stacked, representing file layout) -->
  <!-- Local File Header -->
  <rect x="560" y="52" width="400" height="58" rx="3" fill="#1a1000" stroke="#f59e0b" stroke-width="1.3" class="z-hl"/>
  <text x="580" y="72" fill="#fcd34d" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="700">Local File Header</text>
  <text x="580" y="88" fill="#f59e0b" font-family="IBM Plex Mono,monospace" font-size="9" opacity=".6">sig=PK\x03\x04 · version · flags · compression</text>
  <text x="580" y="102" fill="#f59e0b" font-family="IBM Plex Mono,monospace" font-size="9" opacity=".45">crc32 · compressed_size · filename_len</text>
  <text x="940" y="72" text-anchor="end" fill="#f59e0b" font-family="IBM Plex Mono,monospace" font-size="9" opacity=".5">+0x00</text>

  <!-- File Data -->
  <rect x="560" y="116" width="400" height="46" rx="3" fill="#0d1a0d" stroke="#22c55e" stroke-width="1" stroke-opacity=".8"/>
  <text x="580" y="136" fill="#4ade80" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="700">File Data</text>
  <text x="580" y="152" fill="#22c55e" font-family="IBM Plex Mono,monospace" font-size="9" opacity=".6">deflate / stored · Read → decompress</text>
  <text x="940" y="136" text-anchor="end" fill="#4ade80" font-family="IBM Plex Mono,monospace" font-size="9" opacity=".5">+0x1e</text>

  <!-- (repeat n files) -->
  <text x="760" y="180" text-anchor="middle" fill="#f59e0b" font-family="IBM Plex Mono,monospace" font-size="9" opacity=".3">· · · repeated for each file · · ·</text>

  <!-- Central Directory -->
  <rect x="560" y="192" width="400" height="58" rx="3" fill="#0d1a10" stroke="#22c55e" stroke-width="1.3" class="z-hl2"/>
  <text x="580" y="212" fill="#86efac" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="700">Central Directory</text>
  <text x="580" y="228" fill="#22c55e" font-family="IBM Plex Mono,monospace" font-size="9" opacity=".6">sig=PK\x01\x02 · per-file metadata</text>
  <text x="580" y="242" fill="#22c55e" font-family="IBM Plex Mono,monospace" font-size="9" opacity=".45">offset_to_local_header · external_attrs</text>
  <text x="940" y="212" text-anchor="end" fill="#22c55e" font-family="IBM Plex Mono,monospace" font-size="9" opacity=".5">+0x40</text>

  <!-- EOCD -->
  <rect x="560" y="256" width="400" height="46" rx="3" fill="#041018" stroke="#38bdf8" stroke-width="1.3" class="z-hl3"/>
  <text x="580" y="276" fill="#7dd3fc" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="700">End of Central Directory</text>
  <text x="580" y="292" fill="#38bdf8" font-family="IBM Plex Mono,monospace" font-size="9" opacity=".6">sig=PK\x05\x06 · cd_offset · cd_size · comment</text>
  <text x="940" y="276" text-anchor="end" fill="#38bdf8" font-family="IBM Plex Mono,monospace" font-size="9" opacity=".5">+0x80</text>

  <!-- ─── Far right: Rust extraction arrows ─── -->
  <text x="1010" y="82" fill="#f97316" font-family="IBM Plex Mono,monospace" font-size="10" class="z-lbl">seek(EOCD)</text>
  <text x="1010" y="142" fill="#f97316" font-family="IBM Plex Mono,monospace" font-size="10" class="z-lbl2">read_dir()</text>
  <text x="1010" y="222" fill="#f97316" font-family="IBM Plex Mono,monospace" font-size="10" class="z-lbl3">deflate()</text>
  <text x="1010" y="282" fill="#f97316" font-family="IBM Plex Mono,monospace" font-size="10" class="z-lbl4">crc32 ✓</text>

  <!-- connector lines -->
  <line x1="963" y1="80"  x2="1005" y2="80"  stroke="#f97316" stroke-width=".7" stroke-opacity=".3" stroke-dasharray="3 4"/>
  <line x1="963" y1="140" x2="1005" y2="140" stroke="#f97316" stroke-width=".7" stroke-opacity=".3" stroke-dasharray="3 4"/>
  <line x1="963" y1="220" x2="1005" y2="220" stroke="#f97316" stroke-width=".7" stroke-opacity=".3" stroke-dasharray="3 4"/>
  <line x1="963" y1="280" x2="1005" y2="280" stroke="#f97316" stroke-width=".7" stroke-opacity=".3" stroke-dasharray="3 4"/>

  <!-- left hex ↔ right structure connector arrow -->
  <path d="M 427 82 C 480 82 520 82 555 82" fill="none" stroke="#f59e0b" stroke-width=".8" stroke-opacity=".3" stroke-dasharray="4 5"/>
  <path d="M 427 214 C 480 214 520 214 555 214" fill="none" stroke="#22c55e" stroke-width=".8" stroke-opacity=".25" stroke-dasharray="4 5"/>
  <path d="M 427 212 C 480 212 520 212 555 212" fill="none" stroke="#38bdf8" stroke-width=".8" stroke-opacity=".2" stroke-dasharray="4 5"/>

  <text x="600" y="358" text-anchor="middle" fill="#f59e0b" font-family="IBM Plex Mono,monospace" font-size="10" opacity=".18">Rust ZIP unarchiver · binary parsing · std::io::Read</text>
</svg>
