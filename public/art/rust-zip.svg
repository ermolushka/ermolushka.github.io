<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="z-bg" x1="0" y1="0" x2="1200" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0c0800"/>
      <stop offset="100%" stop-color="#130f02"/>
    </linearGradient>
    <filter id="z-gf">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .z-s1 { animation: z-hl 4.8s ease-in-out infinite; }
    .z-s2 { animation: z-hl 4.8s ease-in-out infinite; animation-delay: 1.2s; }
    .z-s3 { animation: z-hl 4.8s ease-in-out infinite; animation-delay: 2.4s; }
    .z-s4 { animation: z-hl 4.8s ease-in-out infinite; animation-delay: 3.6s; }
    .z-blink { animation: z-blink 1.1s step-end infinite; }
    .z-lbl { animation: z-breathe 3s ease-in-out infinite; }
    @keyframes z-hl      { 0%,100%{opacity:.18} 50%{opacity:.45} }
    @keyframes z-blink   { 0%,100%{opacity:1} 50%{opacity:0} }
    @keyframes z-breathe { 0%,100%{opacity:.4} 50%{opacity:.85} }
  </style>

  <rect width="1200" height="380" fill="url(#z-bg)"/>

  <!-- grid -->
  <g stroke="#f59e0b" stroke-width=".4" opacity=".03">
    <line x1="0" y1="95"  x2="1200" y2="95"/>
    <line x1="0" y1="190" x2="1200" y2="190"/>
    <line x1="0" y1="285" x2="1200" y2="285"/>
    <line x1="300" y1="0" x2="300"  y2="380"/>
    <line x1="600" y1="0" x2="600"  y2="380"/>
    <line x1="900" y1="0" x2="900"  y2="380"/>
  </g>

  <!-- ── Top: compact hex strip (decorative, full width) ── -->
  <text x="600" y="38" text-anchor="middle" fill="#f59e0b" font-family="IBM Plex Mono,monospace" font-size="10" opacity=".3">
    50 4b 03 04 · 14 00 · 00 00 · 08 00 · 50 4b 01 02 · 3f 00 · 50 4b 05 06 · 00 00
  </text>
  <line x1="100" y1="46" x2="1100" y2="46" stroke="#f59e0b" stroke-width=".4" stroke-opacity=".12"/>

  <!-- ── Main: ZIP structure blocks, spanning full width ── -->
  <!-- Width per section: (1200 - 100 margin) / 4 = ~240px each, with gaps -->

  <!-- 1. Local File Header -->
  <rect x="80"  y="62" width="245" height="210" rx="4" fill="#1a1000" stroke="#f59e0b" stroke-width="1.3" class="z-s1"/>
  <rect x="80"  y="62" width="245" height="210" rx="4" fill="#f59e0b" class="z-s1"/>
  <!-- content -->
  <text x="202" y="86"  text-anchor="middle" fill="#fcd34d" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="700">Local File Header</text>
  <line x1="95" y1="93" x2="310" y2="93" stroke="#f59e0b" stroke-width=".5" stroke-opacity=".3"/>
  <text x="96" y="110" fill="#f59e0b" font-family="IBM Plex Mono,monospace" font-size="9" opacity=".7">sig    PK\x03\x04</text>
  <text x="96" y="127" fill="#f59e0b" font-family="IBM Plex Mono,monospace" font-size="9" opacity=".7">version     0x14</text>
  <text x="96" y="144" fill="#f59e0b" font-family="IBM Plex Mono,monospace" font-size="9" opacity=".7">flags       0x00</text>
  <text x="96" y="161" fill="#f59e0b" font-family="IBM Plex Mono,monospace" font-size="9" opacity=".7">compression    8</text>
  <text x="96" y="178" fill="#f59e0b" font-family="IBM Plex Mono,monospace" font-size="9" opacity=".5">crc32  0x5948..</text>
  <text x="96" y="195" fill="#f59e0b" font-family="IBM Plex Mono,monospace" font-size="9" opacity=".5">comp_size   0x0b</text>
  <text x="96" y="212" fill="#f59e0b" font-family="IBM Plex Mono,monospace" font-size="9" opacity=".5">fname_len   0x08</text>
  <text x="96" y="229" fill="#f59e0b" font-family="IBM Plex Mono,monospace" font-size="9" opacity=".35">fname  test.txt</text>
  <text x="202" y="256" text-anchor="middle" fill="#f59e0b" font-family="IBM Plex Mono,monospace" font-size="8" opacity=".4">+0x00 · 30 bytes</text>

  <!-- arrow -->
  <path d="M 327 167 L 357 167" fill="none" stroke="#f59e0b" stroke-width="1" stroke-opacity=".4" marker-end="url(#arr)"/>

  <!-- 2. File Data (compressed) -->
  <rect x="360" y="62" width="185" height="210" rx="4" fill="#0d180d" stroke="#22c55e" stroke-width="1.3" class="z-s2"/>
  <rect x="360" y="62" width="185" height="210" rx="4" fill="#22c55e" class="z-s2"/>
  <text x="452" y="86"  text-anchor="middle" fill="#86efac" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="700">File Data</text>
  <line x1="375" y1="93" x2="530" y2="93" stroke="#22c55e" stroke-width=".5" stroke-opacity=".3"/>
  <text x="376" y="120" fill="#22c55e" font-family="IBM Plex Mono,monospace" font-size="9" opacity=".7">deflate stream</text>
  <text x="376" y="140" fill="#22c55e" font-family="IBM Plex Mono,monospace" font-size="9" opacity=".55">78 9c cb 48</text>
  <text x="376" y="157" fill="#22c55e" font-family="IBM Plex Mono,monospace" font-size="9" opacity=".55">cd c9 c9 57</text>
  <text x="376" y="174" fill="#22c55e" font-family="IBM Plex Mono,monospace" font-size="9" opacity=".55">08 cf 2f ca</text>
  <text x="376" y="195" fill="#22c55e" font-family="IBM Plex Mono,monospace" font-size="9" opacity=".35">Read + inflate()</text>
  <text x="452" y="256" text-anchor="middle" fill="#22c55e" font-family="IBM Plex Mono,monospace" font-size="8" opacity=".4">+0x1e · n bytes</text>

  <!-- arrow -->
  <path d="M 547 167 L 577 167" fill="none" stroke="#f59e0b" stroke-width="1" stroke-opacity=".4" marker-end="url(#arr)"/>

  <!-- 3. Central Directory -->
  <rect x="580" y="62" width="255" height="210" rx="4" fill="#0d1820" stroke="#38bdf8" stroke-width="1.3" class="z-s3"/>
  <rect x="580" y="62" width="255" height="210" rx="4" fill="#38bdf8" class="z-s3"/>
  <text x="707" y="86"  text-anchor="middle" fill="#7dd3fc" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="700">Central Directory</text>
  <line x1="595" y1="93" x2="820" y2="93" stroke="#38bdf8" stroke-width=".5" stroke-opacity=".3"/>
  <text x="596" y="110" fill="#38bdf8" font-family="IBM Plex Mono,monospace" font-size="9" opacity=".7">sig    PK\x01\x02</text>
  <text x="596" y="127" fill="#38bdf8" font-family="IBM Plex Mono,monospace" font-size="9" opacity=".7">ver_made    0x14</text>
  <text x="596" y="144" fill="#38bdf8" font-family="IBM Plex Mono,monospace" font-size="9" opacity=".7">ver_needed  0x14</text>
  <text x="596" y="161" fill="#38bdf8" font-family="IBM Plex Mono,monospace" font-size="9" opacity=".7">disk_num      0</text>
  <text x="596" y="178" fill="#38bdf8" font-family="IBM Plex Mono,monospace" font-size="9" opacity=".5">lhdr_offset 0x00</text>
  <text x="596" y="195" fill="#38bdf8" font-family="IBM Plex Mono,monospace" font-size="9" opacity=".5">ext_attrs  0x81</text>
  <text x="596" y="212" fill="#38bdf8" font-family="IBM Plex Mono,monospace" font-size="9" opacity=".35">fname  test.txt</text>
  <text x="707" y="256" text-anchor="middle" fill="#38bdf8" font-family="IBM Plex Mono,monospace" font-size="8" opacity=".4">+0x40 · 46 bytes</text>

  <!-- arrow -->
  <path d="M 837 167 L 867 167" fill="none" stroke="#f59e0b" stroke-width="1" stroke-opacity=".4" marker-end="url(#arr)"/>

  <!-- 4. EOCD -->
  <rect x="870" y="62" width="250" height="210" rx="4" fill="#12060a" stroke="#f43f5e" stroke-width="1.3" class="z-s4"/>
  <rect x="870" y="62" width="250" height="210" rx="4" fill="#f43f5e" class="z-s4"/>
  <text x="995" y="86"  text-anchor="middle" fill="#fda4af" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="700">End of Central Dir</text>
  <line x1="885" y1="93" x2="1105" y2="93" stroke="#f43f5e" stroke-width=".5" stroke-opacity=".3"/>
  <text x="886" y="110" fill="#f43f5e" font-family="IBM Plex Mono,monospace" font-size="9" opacity=".7">sig    PK\x05\x06</text>
  <text x="886" y="127" fill="#f43f5e" font-family="IBM Plex Mono,monospace" font-size="9" opacity=".7">disk_num    0x00</text>
  <text x="886" y="144" fill="#f43f5e" font-family="IBM Plex Mono,monospace" font-size="9" opacity=".7">num_entries 0x01</text>
  <text x="886" y="161" fill="#f43f5e" font-family="IBM Plex Mono,monospace" font-size="9" opacity=".7">cd_size     0x2e</text>
  <text x="886" y="178" fill="#f43f5e" font-family="IBM Plex Mono,monospace" font-size="9" opacity=".5">cd_offset   0x40</text>
  <text x="886" y="195" fill="#f43f5e" font-family="IBM Plex Mono,monospace" font-size="9" opacity=".5">comment_len 0x00</text>
  <text x="886" y="215" fill="#f43f5e" font-family="IBM Plex Mono,monospace" font-size="9" opacity=".35">← seek here first</text>
  <text x="995" y="256" text-anchor="middle" fill="#f43f5e" font-family="IBM Plex Mono,monospace" font-size="8" opacity=".4">+0x80 · 22 bytes</text>

  <!-- parse order arrow: bottom, right to left -->
  <path d="M 995 290 Q 995 310 707 310 Q 452 310 202 310 L 202 286" fill="none" stroke="#f59e0b" stroke-width=".8" stroke-opacity=".3" stroke-dasharray="5 4" marker-end="url(#arr-up)"/>
  <text x="600" y="328" text-anchor="middle" fill="#f59e0b" font-family="IBM Plex Mono,monospace" font-size="9" opacity=".35">parse order: seek EOCD first → walk central dir → read local headers</text>

  <!-- arrow markers -->
  <defs>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3z" fill="#f59e0b" opacity=".5"/>
    </marker>
    <marker id="arr-up" markerWidth="6" markerHeight="6" refX="3" refY="1" orient="auto">
      <path d="M0,6 L6,6 L3,0z" fill="#f59e0b" opacity=".4"/>
    </marker>
  </defs>

  <!-- bottom label -->
  <text x="600" y="364" text-anchor="middle" fill="#f59e0b" font-family="IBM Plex Mono,monospace" font-size="10" opacity=".2">Rust ZIP unarchiver · std::io::Read · binary parsing</text>
</svg>
