<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g-bg" x1="0" y1="0" x2="1200" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f0800"/>
      <stop offset="100%" stop-color="#180d00"/>
    </linearGradient>
    <linearGradient id="g-bar1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity=".6"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="g-bar2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fb923c" stop-opacity=".6"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="g-bar3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a3e635" stop-opacity=".6"/>
      <stop offset="100%" stop-color="#84cc16"/>
    </linearGradient>
    <filter id="g-gf">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .g-bar1{animation:g-grow1 3s ease-in-out infinite}
    .g-bar2{animation:g-grow2 3s ease-in-out infinite;animation-delay:.4s}
    .g-bar3{animation:g-grow3 3s ease-in-out infinite;animation-delay:.8s}
    .g-bar4{animation:g-grow4 3s ease-in-out infinite;animation-delay:1.2s}
    .g-bar5{animation:g-grow5 3s ease-in-out infinite;animation-delay:1.6s}
    .g-chip{animation:g-heat 2s ease-in-out infinite}
    .g-mem{animation:g-fill 2.5s ease-in-out infinite}
    .g-lbl{animation:g-breathe 3s ease-in-out infinite}
    @keyframes g-grow1{0%,100%{width:220px}50%{width:280px}}
    @keyframes g-grow2{0%,100%{width:180px}50%{width:240px}}
    @keyframes g-grow3{0%,100%{width:310px}50%{width:360px}}
    @keyframes g-grow4{0%,100%{width:150px}50%{width:200px}}
    @keyframes g-grow5{0%,100%{width:260px}50%{width:310px}}
    @keyframes g-heat{0%,100%{fill:#1a0800;stroke-opacity:.5}50%{fill:#261000;stroke-opacity:1}}
    @keyframes g-fill{0%,100%{width:60px}50%{width:110px}}
    @keyframes g-breathe{0%,100%{opacity:.4}50%{opacity:.8}}
  </style>

  <rect width="1200" height="380" fill="url(#g-bg)"/>

  <!-- grid -->
  <g opacity=".03" stroke="#fbbf24" stroke-width=".5">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="200" y1="0" x2="200" y2="380"/>
    <line x1="700" y1="0" x2="700" y2="380"/>
    <line x1="1000" y1="0" x2="1000" y2="380"/>
  </g>

  <!-- GPU chip visual (left) -->
  <rect x="60" y="90" width="160" height="200" rx="8" fill="#1a0800" stroke="#f59e0b" stroke-width="1.5" class="g-chip"/>
  <!-- chip internals -->
  <g fill="none" stroke="#f59e0b" stroke-width=".5" stroke-opacity=".3">
    <rect x="75" y="105" width="30" height="30" rx="2"/>
    <rect x="112" y="105" width="30" height="30" rx="2"/>
    <rect x="149" y="105" width="30" height="30" rx="2"/>
    <rect x="75" y="142" width="30" height="30" rx="2"/>
    <rect x="112" y="142" width="30" height="30" rx="2"/>
    <rect x="149" y="142" width="30" height="30" rx="2"/>
    <rect x="75" y="179" width="30" height="30" rx="2"/>
    <rect x="112" y="179" width="30" height="30" rx="2"/>
    <rect x="149" y="179" width="30" height="30" rx="2"/>
    <rect x="75" y="216" width="30" height="30" rx="2"/>
    <rect x="112" y="216" width="30" height="30" rx="2"/>
    <rect x="149" y="216" width="30" height="30" rx="2"/>
  </g>
  <!-- SM labels -->
  <text x="90" y="124" text-anchor="middle" fill="#f59e0b" font-family="IBM Plex Mono,monospace" font-size="8" opacity=".5">SM</text>
  <text x="127" y="124" text-anchor="middle" fill="#f59e0b" font-family="IBM Plex Mono,monospace" font-size="8" opacity=".5">SM</text>
  <text x="164" y="124" text-anchor="middle" fill="#f59e0b" font-family="IBM Plex Mono,monospace" font-size="8" opacity=".5">SM</text>
  <text x="140" y="290" text-anchor="middle" fill="#fbbf24" font-family="IBM Plex Mono,monospace" font-size="9" font-weight="600" opacity=".7">RTX 4090</text>

  <!-- VRAM bar -->
  <text x="60" y="312" fill="#f59e0b" font-family="IBM Plex Mono,monospace" font-size="9" opacity=".5">VRAM 24GB</text>
  <rect x="60" y="318" width="160" height="8" rx="2" fill="#1a0800" stroke="#f59e0b" stroke-width=".5" stroke-opacity=".4"/>
  <rect x="60" y="318" height="8" rx="2" fill="url(#g-bar1)" class="g-mem"/>

  <!-- Chart area -->
  <text x="310" y="72" fill="#fbbf24" font-family="IBM Plex Mono,monospace" font-size="11" opacity=".6">tokens / second</text>

  <!-- Y axis -->
  <line x1="300" y1="85" x2="300" y2="315" stroke="#f59e0b" stroke-width=".6" stroke-opacity=".3"/>
  <text x="295" y="100" text-anchor="end" fill="#fbbf24" font-family="IBM Plex Mono,monospace" font-size="9" opacity=".5">4k</text>
  <text x="295" y="150" text-anchor="end" fill="#fbbf24" font-family="IBM Plex Mono,monospace" font-size="9" opacity=".5">3k</text>
  <text x="295" y="200" text-anchor="end" fill="#fbbf24" font-family="IBM Plex Mono,monospace" font-size="9" opacity=".5">2k</text>
  <text x="295" y="250" text-anchor="end" fill="#fbbf24" font-family="IBM Plex Mono,monospace" font-size="9" opacity=".5">1k</text>
  <text x="295" y="315" text-anchor="end" fill="#fbbf24" font-family="IBM Plex Mono,monospace" font-size="9" opacity=".5">0</text>

  <!-- Horizontal grid lines -->
  <g stroke="#f59e0b" stroke-width=".3" stroke-opacity=".1">
    <line x1="300" y1="98" x2="850" y2="98"/>
    <line x1="300" y1="148" x2="850" y2="148"/>
    <line x1="300" y1="198" x2="850" y2="198"/>
    <line x1="300" y1="248" x2="850" y2="248"/>
  </g>

  <!-- Bars with animation -->
  <!-- Bar 1: llama-7b -->
  <rect x="320" y="315" width="0" height="0" fill="url(#g-bar1)" rx="2"/>
  <rect x="320" class="g-bar1" rx="2" fill="url(#g-bar1)" filter="url(#g-gf)">
    <animate attributeName="y" values="315;95;315" dur="3s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/>
    <animate attributeName="height" values="0;220;0" dur="3s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/>
    <animate attributeName="width" values="60;60;60" dur="3s" repeatCount="indefinite"/>
  </rect>
  <text x="350" y="330" text-anchor="middle" fill="#fbbf24" font-family="IBM Plex Mono,monospace" font-size="9" opacity=".6">7B</text>

  <!-- Bar 2: llama-13b -->
  <rect x="430" class="g-bar2" rx="2" fill="url(#g-bar2)">
    <animate attributeName="y" values="315;140;315" dur="3s" begin=".4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/>
    <animate attributeName="height" values="0;175;0" dur="3s" begin=".4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/>
    <animate attributeName="width" values="60;60;60" dur="3s" begin=".4s" repeatCount="indefinite"/>
  </rect>
  <text x="460" y="330" text-anchor="middle" fill="#fb923c" font-family="IBM Plex Mono,monospace" font-size="9" opacity=".6">13B</text>

  <!-- Bar 3: llama-70b -->
  <rect x="540" class="g-bar3" rx="2" fill="url(#g-bar3)">
    <animate attributeName="y" values="315;200;315" dur="3s" begin=".8s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/>
    <animate attributeName="height" values="0;115;0" dur="3s" begin=".8s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/>
    <animate attributeName="width" values="60;60;60" dur="3s" begin=".8s" repeatCount="indefinite"/>
  </rect>
  <text x="570" y="330" text-anchor="middle" fill="#a3e635" font-family="IBM Plex Mono,monospace" font-size="9" opacity=".6">70B</text>

  <!-- Benchmark labels -->
  <text x="320" y="350" fill="#fbbf24" font-family="IBM Plex Mono,monospace" font-size="10" opacity=".45" class="g-lbl">bs=1</text>
  <text x="430" y="350" fill="#fb923c" font-family="IBM Plex Mono,monospace" font-size="10" opacity=".45" class="g-lbl" style="animation-delay:.5s">bs=8</text>
  <text x="540" y="350" fill="#a3e635" font-family="IBM Plex Mono,monospace" font-size="10" opacity=".45" class="g-lbl" style="animation-delay:1s">bs=32</text>

  <!-- Right side stats -->
  <text x="900" y="120" fill="#fbbf24" font-family="IBM Plex Mono,monospace" font-size="11" opacity=".6" class="g-lbl">throughput</text>
  <text x="900" y="140" fill="#fbbf24" font-family="IBM Plex Mono,monospace" font-size="18" font-weight="700" filter="url(#g-gf)">3,847</text>
  <text x="900" y="158" fill="#f59e0b" font-family="IBM Plex Mono,monospace" font-size="10" opacity=".5">tok/s · bf16</text>

  <text x="900" y="210" fill="#fb923c" font-family="IBM Plex Mono,monospace" font-size="11" opacity=".6" class="g-lbl" style="animation-delay:.5s">latency p50</text>
  <text x="900" y="230" fill="#fb923c" font-family="IBM Plex Mono,monospace" font-size="18" font-weight="700">12.4</text>
  <text x="900" y="248" fill="#f97316" font-family="IBM Plex Mono,monospace" font-size="10" opacity=".5">ms / token</text>

  <text x="600" y="358" text-anchor="middle" fill="#f59e0b" font-family="IBM Plex Mono,monospace" font-size="10" opacity=".18">vLLM benchmark · RTX 4090 · continuous batching</text>
</svg>
