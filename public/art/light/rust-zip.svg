<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="z-bg" x1="0" y1="0" x2="1200" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#faf6ef"/>
      <stop offset="100%" stop-color="#f8f6ee"/>
    </linearGradient>
    <filter id="z-gf">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .z-s1 { animation: z-hl 4.8s ease-in-out infinite; }
    .z-s2 { animation: z-hl 4.8s ease-in-out infinite; animation-delay: 1.2s; }
    .z-s3 { animation: z-hl 4.8s ease-in-out infinite; animation-delay: 2.4s; }
    .z-s4 { animation: z-hl 4.8s ease-in-out infinite; animation-delay: 3.6s; }
    .z-blink { animation: z-blink 1.1s step-end infinite; }
    .z-lbl { animation: z-breathe 3s ease-in-out infinite; }
    @keyframes z-hl      { 0%,100%{opacity:0.66} 50%{opacity:0.71} }
    @keyframes z-blink   { 0%,100%{opacity:1.00} 50%{opacity:0.00} }
    @keyframes z-breathe { 0%,100%{opacity:0.70} 50%{opacity:0.85} }
  </style>

  <rect width="1200" height="380" fill="url(#z-bg)"/>

  <!-- grid -->
  <g stroke="#734800" stroke-width=".4" opacity="0.03">
    <line x1="0" y1="95"  x2="1200" y2="95"/>
    <line x1="0" y1="190" x2="1200" y2="190"/>
    <line x1="0" y1="285" x2="1200" y2="285"/>
    <line x1="300" y1="0" x2="300"  y2="380"/>
    <line x1="600" y1="0" x2="600"  y2="380"/>
    <line x1="900" y1="0" x2="900"  y2="380"/>
  </g>

  <!-- ── Top: compact hex strip (decorative, full width) ── -->
  <text x="600" y="38" text-anchor="middle" fill="#734800" font-family="IBM Plex Mono,monospace" font-size="10" opacity="0.68">
    50 4b 03 04 · 14 00 · 00 00 · 08 00 · 50 4b 01 02 · 3f 00 · 50 4b 05 06 · 00 00
  </text>
  <line x1="100" y1="46" x2="1100" y2="46" stroke="#734800" stroke-width=".4" stroke-opacity="0.12"/>

  <!-- ── Main: ZIP structure blocks, spanning full width ── -->
  <!-- Width per section: (1200 - 100 margin) / 4 = ~240px each, with gaps -->

  <!-- 1. Local File Header -->
  <rect x="80"  y="62" width="245" height="210" rx="4" fill="#f9f4ec" stroke="#734800" stroke-width="1.3" class="z-s1"/>
  <rect x="80"  y="62" width="245" height="210" rx="4" fill="#734800" class="z-s1"/>
  <!-- content -->
  <text x="202" y="86"  text-anchor="middle" fill="#886800" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="700">Local File Header</text>
  <line x1="95" y1="93" x2="310" y2="93" stroke="#734800" stroke-width=".5" stroke-opacity="0.68"/>
  <text x="96" y="110" fill="#734800" font-family="IBM Plex Mono,monospace" font-size="9" opacity="0.70">sig    PK\x03\x04</text>
  <text x="96" y="127" fill="#734800" font-family="IBM Plex Mono,monospace" font-size="9" opacity="0.70">version     0x14</text>
  <text x="96" y="144" fill="#734800" font-family="IBM Plex Mono,monospace" font-size="9" opacity="0.70">flags       0x00</text>
  <text x="96" y="161" fill="#734800" font-family="IBM Plex Mono,monospace" font-size="9" opacity="0.70">compression    8</text>
  <text x="96" y="178" fill="#734800" font-family="IBM Plex Mono,monospace" font-size="9" opacity="0.72">crc32  0x5948..</text>
  <text x="96" y="195" fill="#734800" font-family="IBM Plex Mono,monospace" font-size="9" opacity="0.72">comp_size   0x0b</text>
  <text x="96" y="212" fill="#734800" font-family="IBM Plex Mono,monospace" font-size="9" opacity="0.72">fname_len   0x08</text>
  <text x="96" y="229" fill="#734800" font-family="IBM Plex Mono,monospace" font-size="9" opacity="0.69">fname  test.txt</text>
  <text x="202" y="256" text-anchor="middle" fill="#734800" font-family="IBM Plex Mono,monospace" font-size="8" opacity="0.70">+0x00 · 30 bytes</text>

  <!-- arrow -->
  <path d="M 327 167 L 357 167" fill="none" stroke="#734800" stroke-width="1" stroke-opacity="0.70" marker-end="url(#arr)"/>

  <!-- 2. File Data (compressed) -->
  <rect x="360" y="62" width="185" height="210" rx="4" fill="#eff3ef" stroke="#0c5f2b" stroke-width="1.3" class="z-s2"/>
  <rect x="360" y="62" width="185" height="210" rx="4" fill="#0c5f2b" class="z-s2"/>
  <text x="452" y="86"  text-anchor="middle" fill="#0c8a39" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="700">File Data</text>
  <line x1="375" y1="93" x2="530" y2="93" stroke="#0c5f2b" stroke-width=".5" stroke-opacity="0.68"/>
  <text x="376" y="120" fill="#0c5f2b" font-family="IBM Plex Mono,monospace" font-size="9" opacity="0.70">deflate stream</text>
  <text x="376" y="140" fill="#0c5f2b" font-family="IBM Plex Mono,monospace" font-size="9" opacity="0.73">78 9c cb 48</text>
  <text x="376" y="157" fill="#0c5f2b" font-family="IBM Plex Mono,monospace" font-size="9" opacity="0.73">cd c9 c9 57</text>
  <text x="376" y="174" fill="#0c5f2b" font-family="IBM Plex Mono,monospace" font-size="9" opacity="0.73">08 cf 2f ca</text>
  <text x="376" y="195" fill="#0c5f2b" font-family="IBM Plex Mono,monospace" font-size="9" opacity="0.69">Read + inflate()</text>
  <text x="452" y="256" text-anchor="middle" fill="#0c5f2b" font-family="IBM Plex Mono,monospace" font-size="8" opacity="0.70">+0x1e · n bytes</text>

  <!-- arrow -->
  <path d="M 547 167 L 577 167" fill="none" stroke="#734800" stroke-width="1" stroke-opacity="0.70" marker-end="url(#arr)"/>

  <!-- 3. Central Directory -->
  <rect x="580" y="62" width="255" height="210" rx="4" fill="#ecf0f3" stroke="#005981" stroke-width="1.3" class="z-s3"/>
  <rect x="580" y="62" width="255" height="210" rx="4" fill="#005981" class="z-s3"/>
  <text x="707" y="86"  text-anchor="middle" fill="#006697" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="700">Central Directory</text>
  <line x1="595" y1="93" x2="820" y2="93" stroke="#005981" stroke-width=".5" stroke-opacity="0.68"/>
  <text x="596" y="110" fill="#005981" font-family="IBM Plex Mono,monospace" font-size="9" opacity="0.70">sig    PK\x01\x02</text>
  <text x="596" y="127" fill="#005981" font-family="IBM Plex Mono,monospace" font-size="9" opacity="0.70">ver_made    0x14</text>
  <text x="596" y="144" fill="#005981" font-family="IBM Plex Mono,monospace" font-size="9" opacity="0.70">ver_needed  0x14</text>
  <text x="596" y="161" fill="#005981" font-family="IBM Plex Mono,monospace" font-size="9" opacity="0.70">disk_num      0</text>
  <text x="596" y="178" fill="#005981" font-family="IBM Plex Mono,monospace" font-size="9" opacity="0.72">lhdr_offset 0x00</text>
  <text x="596" y="195" fill="#005981" font-family="IBM Plex Mono,monospace" font-size="9" opacity="0.72">ext_attrs  0x81</text>
  <text x="596" y="212" fill="#005981" font-family="IBM Plex Mono,monospace" font-size="9" opacity="0.69">fname  test.txt</text>
  <text x="707" y="256" text-anchor="middle" fill="#005981" font-family="IBM Plex Mono,monospace" font-size="8" opacity="0.70">+0x40 · 46 bytes</text>

  <!-- arrow -->
  <path d="M 837 167 L 867 167" fill="none" stroke="#734800" stroke-width="1" stroke-opacity="0.70" marker-end="url(#arr)"/>

  <!-- 4. EOCD -->
  <rect x="870" y="62" width="250" height="210" rx="4" fill="#f6f0f2" stroke="#810117" stroke-width="1.3" class="z-s4"/>
  <rect x="870" y="62" width="250" height="210" rx="4" fill="#810117" class="z-s4"/>
  <text x="995" y="86"  text-anchor="middle" fill="#a30014" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="700">End of Central Dir</text>
  <line x1="885" y1="93" x2="1105" y2="93" stroke="#810117" stroke-width=".5" stroke-opacity="0.68"/>
  <text x="886" y="110" fill="#810117" font-family="IBM Plex Mono,monospace" font-size="9" opacity="0.70">sig    PK\x05\x06</text>
  <text x="886" y="127" fill="#810117" font-family="IBM Plex Mono,monospace" font-size="9" opacity="0.70">disk_num    0x00</text>
  <text x="886" y="144" fill="#810117" font-family="IBM Plex Mono,monospace" font-size="9" opacity="0.70">num_entries 0x01</text>
  <text x="886" y="161" fill="#810117" font-family="IBM Plex Mono,monospace" font-size="9" opacity="0.70">cd_size     0x2e</text>
  <text x="886" y="178" fill="#810117" font-family="IBM Plex Mono,monospace" font-size="9" opacity="0.72">cd_offset   0x40</text>
  <text x="886" y="195" fill="#810117" font-family="IBM Plex Mono,monospace" font-size="9" opacity="0.72">comment_len 0x00</text>
  <text x="886" y="215" fill="#810117" font-family="IBM Plex Mono,monospace" font-size="9" opacity="0.69">← seek here first</text>
  <text x="995" y="256" text-anchor="middle" fill="#810117" font-family="IBM Plex Mono,monospace" font-size="8" opacity="0.70">+0x80 · 22 bytes</text>

  <!-- parse order arrow: bottom, right to left -->
  <path d="M 995 290 Q 995 310 707 310 Q 452 310 202 310 L 202 286" fill="none" stroke="#734800" stroke-width=".8" stroke-opacity="0.68" stroke-dasharray="5 4" marker-end="url(#arr-up)"/>
  <text x="600" y="328" text-anchor="middle" fill="#734800" font-family="IBM Plex Mono,monospace" font-size="9" opacity="0.69">parse order: seek EOCD first → walk central dir → read local headers</text>

  <!-- arrow markers -->
  <defs>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3z" fill="#734800" opacity="0.72"/>
    </marker>
    <marker id="arr-up" markerWidth="6" markerHeight="6" refX="3" refY="1" orient="auto">
      <path d="M0,6 L6,6 L3,0z" fill="#734800" opacity="0.70"/>
    </marker>
  </defs>

  <!-- bottom label -->
  <text x="600" y="364" text-anchor="middle" fill="#734800" font-family="IBM Plex Mono,monospace" font-size="10" opacity="0.66">Rust ZIP unarchiver · std::io::Read · binary parsing</text>
</svg>
