<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g-bg" x1="0" y1="0" x2="1200" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#faf4ef"/>
      <stop offset="100%" stop-color="#f9f3ed"/>
    </linearGradient>
    <filter id="g-gf">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .g-lbl { animation: g-breathe 3s ease-in-out infinite; }
    @keyframes g-breathe { 0%,100%{opacity:0.71} 50%{opacity:0.90} }
  </style>

  <rect width="1200" height="380" fill="url(#g-bg)"/>

  <!-- subtle grid -->
  <g stroke="#734800" stroke-width=".4" opacity="0.04">
    <line x1="0" y1="80"  x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
  </g>

  <!-- title -->
  <text x="600" y="44" text-anchor="middle" fill="#7c5900" font-family="IBM Plex Mono,monospace" font-size="12" opacity="0.73">throughput benchmark · tokens / second</text>

  <!-- Y-axis -->
  <line x1="160" y1="68" x2="160" y2="310" stroke="#734800" stroke-width=".6" stroke-opacity="0.67"/>
  <text x="152" y="85"  text-anchor="end" fill="#7c5900" font-family="IBM Plex Mono,monospace" font-size="9" opacity="0.71">4k</text>
  <text x="152" y="142" text-anchor="end" fill="#7c5900" font-family="IBM Plex Mono,monospace" font-size="9" opacity="0.71">3k</text>
  <text x="152" y="199" text-anchor="end" fill="#7c5900" font-family="IBM Plex Mono,monospace" font-size="9" opacity="0.71">2k</text>
  <text x="152" y="256" text-anchor="end" fill="#7c5900" font-family="IBM Plex Mono,monospace" font-size="9" opacity="0.71">1k</text>
  <text x="152" y="313" text-anchor="end" fill="#7c5900" font-family="IBM Plex Mono,monospace" font-size="9" opacity="0.71">0</text>

  <!-- grid lines -->
  <g stroke="#734800" stroke-width=".3" stroke-opacity="0.08">
    <line x1="160" y1="83"  x2="1060" y2="83"/>
    <line x1="160" y1="140" x2="1060" y2="140"/>
    <line x1="160" y1="197" x2="1060" y2="197"/>
    <line x1="160" y1="254" x2="1060" y2="254"/>
  </g>

  <!-- bar groups — 4 models, each with 3 batch sizes — centered at x=600 -->
  <!-- Group spacing: 4 groups × ~200px = 800px, from x=200 to x=1000 -->

  <!-- Model: Llama-7B -->
  <text x="297" y="330" text-anchor="middle" fill="#7c5900" font-family="IBM Plex Mono,monospace" font-size="10" opacity="0.74">Llama-7B</text>
  <!-- bs=1 -->
  <rect x="205" y="310" width="48" height="0" fill="#7c5900" rx="2">
    <animate attributeName="y"      values="310;88;310"  dur="3s" begin="0s"   repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .2 1;.4 0 .2 1"/>
    <animate attributeName="height" values="0;222;0"     dur="3s" begin="0s"   repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .2 1;.4 0 .2 1"/>
  </rect>
  <!-- bs=8 -->
  <rect x="261" y="310" width="48" height="0" fill="#833b00" rx="2">
    <animate attributeName="y"      values="310;127;310" dur="3s" begin=".15s" repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .2 1;.4 0 .2 1"/>
    <animate attributeName="height" values="0;183;0"     dur="3s" begin=".15s" repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .2 1;.4 0 .2 1"/>
  </rect>
  <!-- bs=32 -->
  <rect x="317" y="310" width="48" height="0" fill="#4a7209" rx="2">
    <animate attributeName="y"      values="310;172;310" dur="3s" begin=".3s"  repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .2 1;.4 0 .2 1"/>
    <animate attributeName="height" values="0;138;0"     dur="3s" begin=".3s"  repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .2 1;.4 0 .2 1"/>
  </rect>

  <!-- Model: Llama-13B -->
  <text x="497" y="330" text-anchor="middle" fill="#7c5900" font-family="IBM Plex Mono,monospace" font-size="10" opacity="0.74">Llama-13B</text>
  <rect x="405" y="310" width="48" height="0" fill="#7c5900" rx="2">
    <animate attributeName="y"      values="310;138;310" dur="3s" begin=".1s"  repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .2 1;.4 0 .2 1"/>
    <animate attributeName="height" values="0;172;0"     dur="3s" begin=".1s"  repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .2 1;.4 0 .2 1"/>
  </rect>
  <rect x="461" y="310" width="48" height="0" fill="#833b00" rx="2">
    <animate attributeName="y"      values="310;168;310" dur="3s" begin=".25s" repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .2 1;.4 0 .2 1"/>
    <animate attributeName="height" values="0;142;0"     dur="3s" begin=".25s" repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .2 1;.4 0 .2 1"/>
  </rect>
  <rect x="517" y="310" width="48" height="0" fill="#4a7209" rx="2">
    <animate attributeName="y"      values="310;200;310" dur="3s" begin=".4s"  repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .2 1;.4 0 .2 1"/>
    <animate attributeName="height" values="0;110;0"     dur="3s" begin=".4s"  repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .2 1;.4 0 .2 1"/>
  </rect>

  <!-- Model: Llama-70B -->
  <text x="697" y="330" text-anchor="middle" fill="#7c5900" font-family="IBM Plex Mono,monospace" font-size="10" opacity="0.74">Llama-70B</text>
  <rect x="605" y="310" width="48" height="0" fill="#7c5900" rx="2">
    <animate attributeName="y"      values="310;240;310" dur="3s" begin=".2s"  repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .2 1;.4 0 .2 1"/>
    <animate attributeName="height" values="0;70;0"      dur="3s" begin=".2s"  repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .2 1;.4 0 .2 1"/>
  </rect>
  <rect x="661" y="310" width="48" height="0" fill="#833b00" rx="2">
    <animate attributeName="y"      values="310;256;310" dur="3s" begin=".35s" repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .2 1;.4 0 .2 1"/>
    <animate attributeName="height" values="0;54;0"      dur="3s" begin=".35s" repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .2 1;.4 0 .2 1"/>
  </rect>
  <rect x="717" y="310" width="48" height="0" fill="#4a7209" rx="2">
    <animate attributeName="y"      values="310;265;310" dur="3s" begin=".5s"  repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .2 1;.4 0 .2 1"/>
    <animate attributeName="height" values="0;45;0"      dur="3s" begin=".5s"  repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .2 1;.4 0 .2 1"/>
  </rect>

  <!-- Model: Mixtral-8x7B -->
  <text x="897" y="330" text-anchor="middle" fill="#7c5900" font-family="IBM Plex Mono,monospace" font-size="10" opacity="0.74">Mixtral-8x7B</text>
  <rect x="805" y="310" width="48" height="0" fill="#7c5900" rx="2">
    <animate attributeName="y"      values="310;180;310" dur="3s" begin=".05s" repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .2 1;.4 0 .2 1"/>
    <animate attributeName="height" values="0;130;0"     dur="3s" begin=".05s" repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .2 1;.4 0 .2 1"/>
  </rect>
  <rect x="861" y="310" width="48" height="0" fill="#833b00" rx="2">
    <animate attributeName="y"      values="310;205;310" dur="3s" begin=".2s"  repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .2 1;.4 0 .2 1"/>
    <animate attributeName="height" values="0;105;0"     dur="3s" begin=".2s"  repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .2 1;.4 0 .2 1"/>
  </rect>
  <rect x="917" y="310" width="48" height="0" fill="#4a7209" rx="2">
    <animate attributeName="y"      values="310;222;310" dur="3s" begin=".35s" repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .2 1;.4 0 .2 1"/>
    <animate attributeName="height" values="0;88;0"      dur="3s" begin=".35s" repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .2 1;.4 0 .2 1"/>
  </rect>

  <!-- X-axis line -->
  <line x1="160" y1="310" x2="1060" y2="310" stroke="#734800" stroke-width=".6" stroke-opacity="0.67"/>

  <!-- Legend — centered -->
  <circle cx="426" cy="356" r="5" fill="#7c5900"/>
  <text x="435" y="360" fill="#7c5900" font-family="IBM Plex Mono,monospace" font-size="10" opacity="0.74">batch=1</text>
  <circle cx="536" cy="356" r="5" fill="#833b00"/>
  <text x="545" y="360" fill="#833b00" font-family="IBM Plex Mono,monospace" font-size="10" opacity="0.74">batch=8</text>
  <circle cx="646" cy="356" r="5" fill="#4a7209"/>
  <text x="655" y="360" fill="#4a7209" font-family="IBM Plex Mono,monospace" font-size="10" opacity="0.74">batch=32</text>

  <!-- badge -->
  <rect x="1065" y="68" width="110" height="26" rx="3" fill="#f9f0ec" stroke="#734800" stroke-width=".8" stroke-opacity="0.72"/>
  <text x="1120" y="85" text-anchor="middle" fill="#886800" font-family="IBM Plex Mono,monospace" font-size="10" font-weight="600">RTX 4090</text>
  <rect x="1065" y="102" width="110" height="26" rx="3" fill="#f9f0ec" stroke="#773100" stroke-width=".8" stroke-opacity="0.72"/>
  <text x="1120" y="119" text-anchor="middle" fill="#833b00" font-family="IBM Plex Mono,monospace" font-size="10" font-weight="600">vLLM · bf16</text>
</svg>
