<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="w-bg" x1="0" y1="0" x2="1200" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050a05"/>
      <stop offset="100%" stop-color="#080d08"/>
    </linearGradient>
    <filter id="w-gf">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .w-snake{animation:w-move 4s linear infinite}
    .w-apple{animation:w-pulse 1s ease-in-out infinite}
    .w-rain{animation:w-fall linear infinite}
    .w-score{animation:w-count 8s linear infinite}
    @keyframes w-move{0%,100%{transform:translateX(0)}50%{transform:translateX(24px)}}
    @keyframes w-pulse{0%,100%{opacity:.9;transform:scale(1)}50%{opacity:.5;transform:scale(.85)}}
    @keyframes w-fall{from{transform:translateY(-40px);opacity:0}30%{opacity:1}70%{opacity:.7}to{transform:translateY(420px);opacity:0}}
    @keyframes w-count{0%{opacity:.3}100%{opacity:.3}}
  </style>

  <rect width="1200" height="380" fill="url(#w-bg)"/>

  <!-- Matrix rain columns -->
  <g font-family="IBM Plex Mono,monospace" font-size="13" fill="#4ade80">
    <!-- col 1 -->
    <text x="100" y="0" class="w-rain" style="animation-duration:2.1s;animation-delay:.3s;opacity:.15">0110</text>
    <text x="100" y="60" class="w-rain" style="animation-duration:2.1s;animation-delay:1.1s;opacity:.08">1001</text>
    <!-- col 2 -->
    <text x="170" y="0" class="w-rain" style="animation-duration:1.8s;animation-delay:.9s;opacity:.12">wasm</text>
    <text x="170" y="80" class="w-rain" style="animation-duration:1.8s;animation-delay:1.7s;opacity:.07">rust</text>
    <!-- col 3 -->
    <text x="240" y="0" class="w-rain" style="animation-duration:2.4s;animation-delay:.1s;opacity:.1">1100</text>
    <!-- col 9 -->
    <text x="940" y="0" class="w-rain" style="animation-duration:2.2s;animation-delay:.4s;opacity:.12">0101</text>
    <!-- col 10 -->
    <text x="1010" y="0" class="w-rain" style="animation-duration:1.9s;animation-delay:1.3s;opacity:.1">wasm</text>
    <!-- col 11 -->
    <text x="1080" y="0" class="w-rain" style="animation-duration:2.5s;animation-delay:.6s;opacity:.08">1010</text>
    <text x="1080" y="70" class="w-rain" style="animation-duration:2.5s;animation-delay:1.6s;opacity:.05">0110</text>
  </g>

  <!-- Game board -->
  <!-- Board border -->
  <rect x="390" y="60" width="420" height="260" rx="4" fill="#070d07" stroke="#4ade80" stroke-width="1.5" stroke-opacity=".4"/>

  <!-- Grid cells (subtle) -->
  <g stroke="#4ade80" stroke-width=".3" stroke-opacity=".06">
    <!-- horizontal lines every 20px inside the board -->
    <line x1="390" y1="80" x2="810" y2="80"/>
    <line x1="390" y1="100" x2="810" y2="100"/>
    <line x1="390" y1="120" x2="810" y2="120"/>
    <line x1="390" y1="140" x2="810" y2="140"/>
    <line x1="390" y1="160" x2="810" y2="160"/>
    <line x1="390" y1="180" x2="810" y2="180"/>
    <line x1="390" y1="200" x2="810" y2="200"/>
    <line x1="390" y1="220" x2="810" y2="220"/>
    <line x1="390" y1="240" x2="810" y2="240"/>
    <line x1="390" y1="260" x2="810" y2="260"/>
    <line x1="390" y1="280" x2="810" y2="280"/>
    <!-- vertical -->
    <line x1="410" y1="60" x2="410" y2="320"/>
    <line x1="430" y1="60" x2="430" y2="320"/>
    <line x1="450" y1="60" x2="450" y2="320"/>
    <line x1="470" y1="60" x2="470" y2="320"/>
    <line x1="490" y1="60" x2="490" y2="320"/>
    <line x1="510" y1="60" x2="510" y2="320"/>
    <line x1="530" y1="60" x2="530" y2="320"/>
    <line x1="550" y1="60" x2="550" y2="320"/>
    <line x1="570" y1="60" x2="570" y2="320"/>
    <line x1="590" y1="60" x2="590" y2="320"/>
    <line x1="610" y1="60" x2="610" y2="320"/>
    <line x1="630" y1="60" x2="630" y2="320"/>
    <line x1="650" y1="60" x2="650" y2="320"/>
    <line x1="670" y1="60" x2="670" y2="320"/>
    <line x1="690" y1="60" x2="690" y2="320"/>
    <line x1="710" y1="60" x2="710" y2="320"/>
    <line x1="730" y1="60" x2="730" y2="320"/>
    <line x1="750" y1="60" x2="750" y2="320"/>
    <line x1="770" y1="60" x2="770" y2="320"/>
    <line x1="790" y1="60" x2="790" y2="320"/>
  </g>

  <!-- Snake body (series of cells) -->
  <!-- head -->
  <rect x="571" y="161" width="18" height="18" rx="2" fill="#4ade80" filter="url(#w-gf)"/>
  <!-- body segment 1 -->
  <rect x="551" y="161" width="18" height="18" rx="2" fill="#22c55e"/>
  <!-- body segment 2 -->
  <rect x="531" y="161" width="18" height="18" rx="2" fill="#16a34a"/>
  <!-- body segment 3 -->
  <rect x="531" y="181" width="18" height="18" rx="2" fill="#15803d"/>
  <!-- body segment 4 -->
  <rect x="531" y="201" width="18" height="18" rx="2" fill="#166534"/>
  <!-- tail -->
  <rect x="551" y="201" width="18" height="18" rx="2" fill="#14532d" opacity=".8"/>

  <!-- Apple / food -->
  <rect x="691" y="221" width="18" height="18" rx="2" fill="#ef4444" class="w-apple" filter="url(#w-gf)"/>

  <!-- Score display -->
  <text x="600" y="50" text-anchor="middle" fill="#4ade80" font-family="IBM Plex Mono,monospace" font-size="12" opacity=".6">SCORE: 042</text>

  <!-- WASM badge -->
  <rect x="820" y="70" width="90" height="28" rx="4" fill="#1a0a00" stroke="#f59e0b" stroke-width="1" stroke-opacity=".6"/>
  <text x="865" y="88" text-anchor="middle" fill="#fcd34d" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="600">WASM</text>

  <!-- Rust badge -->
  <rect x="820" y="108" width="90" height="28" rx="4" fill="#1a0605" stroke="#f97316" stroke-width="1" stroke-opacity=".6"/>
  <text x="865" y="126" text-anchor="middle" fill="#fb923c" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="600">RUST</text>

  <!-- Left side labels -->
  <text x="380" y="96" text-anchor="end" fill="#4ade80" font-family="IBM Plex Mono,monospace" font-size="10" opacity=".45">canvas API</text>
  <text x="380" y="196" text-anchor="end" fill="#4ade80" font-family="IBM Plex Mono,monospace" font-size="10" opacity=".35">game loop</text>
  <text x="380" y="296" text-anchor="end" fill="#4ade80" font-family="IBM Plex Mono,monospace" font-size="10" opacity=".25">wasm_bindgen</text>

  <!-- bottom label -->
  <text x="600" y="358" text-anchor="middle" fill="#4ade80" font-family="IBM Plex Mono,monospace" font-size="10" opacity=".18">Snake game · Rust → WASM → Canvas</text>
</svg>
